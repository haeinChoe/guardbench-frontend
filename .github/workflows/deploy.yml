name: Frontend CI and Staging Deploy

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect verification scope
    runs-on: ubuntu-latest
    outputs:
      verification_required: ${{ steps.scope.outputs.verification_required }}
      deployment_required: ${{ steps.scope.outputs.deployment_required }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-change-scope.mjs

  workflow_tests:
    name: Workflow Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Test CI change scope rules
        run: node --test scripts/ci-change-scope.test.mjs

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.verification_required == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Project
        run: npm run lint

      - name: Test Project
        run: npm test

      - name: Build Project
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error

  component-test:
    name: Component Test (Chromium)
    needs: changes
    if: needs.changes.outputs.verification_required == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test Components
        run: npm run test:component

  verify:
    name: verify
    needs: [changes, workflow_tests, build, component-test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require applicable checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VERIFICATION_REQUIRED: ${{ needs.changes.outputs.verification_required }}
          WORKFLOW_TESTS_RESULT: ${{ needs.workflow_tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          COMPONENT_TEST_RESULT: ${{ needs.component-test.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          test "$WORKFLOW_TESTS_RESULT" = success

          if [[ "$VERIFICATION_REQUIRED" != "true" ]]; then
            {
              echo '### Verification scope'
              echo '- No application source, test, build or workflow inputs changed.'
              echo '- Full lint, test, component-test and build jobs were skipped.'
              echo '- Lightweight workflow tests passed.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          test "$BUILD_RESULT" = success
          test "$COMPONENT_TEST_RESULT" = success
          {
            echo '### Verification aggregate'
            echo "- Build: ${BUILD_RESULT}"
            echo "- Component Test: ${COMPONENT_TEST_RESULT}"
            echo "- Workflow Tests: ${WORKFLOW_TESTS_RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Staging
    needs: [changes, verify]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.deployment_required == 'true' &&
      needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v6
        with:
          name: frontend-dist
          path: dist/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: guardbench-frontend-deploy
          aws-region: ap-northeast-2

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://guardbench-dev-frontend --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id E1PVL0Z78B1HMR --paths "/*"
